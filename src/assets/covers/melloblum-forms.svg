  <text x="115" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="27">Support</text>
  <text x="665" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="27">Support</text>
  <text x="75" y="585" fill="#e2e8f0" font-family="sans-serif" font-size="28">Compare form labels before comparing skills.</text>
