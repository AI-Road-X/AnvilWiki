  <rect x="75" y="260" width="500" height="245" rx="22" fill="#1e4032"/>
  <rect x="625" y="260" width="500" height="245" rx="22" fill="#35433d"/>
  <text x="115" y="330" fill="#fff" font-family="sans-serif" font-size="34">BASIC FORM</text>
  <text x="665" y="330" fill="#fff" font-family="sans-serif" font-size="34">PRISMANA FORM</text>
