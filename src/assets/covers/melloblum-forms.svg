<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Melloblum: Basic and Prismana forms</title>
  <desc id="desc">Original comparison diagram: Basic is Grass; Prismana lists holy and Grass. Both official pages classify Melloblum as Support.</desc>
  <rect width="1200" height="675" fill="#10261f"/>
