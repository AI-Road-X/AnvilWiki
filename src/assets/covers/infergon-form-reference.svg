<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aniimo 067 Infergon form reference</title>
  <desc id="desc">Basic Form has Fire; Prismana has Fire and Wind. Both list 505 total attributes. An original comparison diagram, not official character artwork.</desc>
  <rect width="1200" height="675" fill="#171e2d"/>
  <path d="M880 10 1170 175 1090 420 805 490 665 230Z" fill="#553e62" opacity=".35"/>
  <text x="70" y="78" fill="#fbbf77" font-family="sans-serif" font-size="23" letter-spacing="3">ANIIMO WIKI / NO.067</text>
  <text x="70" y="170" fill="#fff" font-family="sans-serif" font-size="72" font-weight="700">Infergon</text>
  <text x="70" y="220" fill="#b5c2d8" font-family="sans-serif" font-size="27">Compare the form. Keep the conditions.</text>
  <rect x="70" y="265" width="510" height="240" rx="20" fill="#3c2e2d"/>
  <rect x="620" y="265" width="510" height="240" rx="20" fill="#3a304d"/>
  <text x="105" y="320" fill="#f2dbc6" font-family="sans-serif" font-size="24">BASIC FORM</text>
  <text x="655" y="320" fill="#e0d3fa" font-family="sans-serif" font-size="24">PRISMANA FORM</text>
  <text x="105" y="390" fill="#ffbd77" font-family="sans-serif" font-size="44" font-weight="700">Fire</text>
  <text x="655" y="390" fill="#e2c4ff" font-family="sans-serif" font-size="44" font-weight="700">Fire + Wind</text>
  <text x="105" y="462" fill="#fff" font-family="sans-serif" font-size="30">505 total / DPS</text>
  <text x="655" y="462" fill="#fff" font-family="sans-serif" font-size="30">505 total / DPS</text>
  <text x="70" y="564" fill="#e7edf8" font-family="sans-serif" font-size="28">Power of Fire: the target needs more than 5 stacks.</text>
  <text x="70" y="625" fill="#aab7cd" font-family="sans-serif" font-size="20">Original reference diagram / official Wiki data / not a gameplay screenshot</text>
</svg>
