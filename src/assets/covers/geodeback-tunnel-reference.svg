<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aniimo 073 Geodeback Tunnel conditions</title>
  <desc id="desc">Tunnel blocks ranged attacks while consuming stamina. Earth Affinity allows skills and adds 20 percent BREAK while Tunneling. Pound skills can launch Geodeback.</desc>
  <rect width="1200" height="675" fill="#162520"/>
  <path d="M850 90 1110 190 1150 415 920 550 720 410 680 220Z" fill="#354d3a"/>
  <text x="70" y="78" fill="#c8df8c" font-family="sans-serif" font-size="23" letter-spacing="3">ANIIMO WIKI / NO.073</text>
  <text x="70" y="170" fill="#fff" font-family="sans-serif" font-size="72" font-weight="700">Geodeback</text>
  <text x="70" y="220" fill="#bcd2c5" font-family="sans-serif" font-size="27">Rock / BREAK / 486 total attributes</text>
  <rect x="70" y="270" width="515" height="245" rx="20" fill="#294238"/>
  <rect x="615" y="270" width="515" height="245" rx="20" fill="#404134"/>
  <text x="105" y="325" fill="#a7ecc1" font-family="sans-serif" font-size="25">WHILE TUNNELING</text>
  <text x="105" y="385" fill="#fff" font-family="sans-serif" font-size="30">Ranged protection</text>
  <text x="105" y="432" fill="#fff" font-family="sans-serif" font-size="30">Skills + 20% extra BREAK</text>
  <text x="105" y="481" fill="#bcd2c5" font-family="sans-serif" font-size="24">Consumes stamina continuously</text>
  <text x="650" y="325" fill="#f7d68d" font-family="sans-serif" font-size="25">NOT UNIVERSAL IMMUNITY</text>
  <text x="650" y="385" fill="#fff" font-family="sans-serif" font-size="30">Pound can launch it</text>
  <text x="650" y="432" fill="#fff" font-family="sans-serif" font-size="30">State and stamina matter</text>
  <text x="650" y="481" fill="#d5d1bb" font-family="sans-serif" font-size="24">Do not assume every attack is blocked</text>
  <text x="70" y="574" fill="#e4f0e7" font-family="sans-serif" font-size="27">Conditional protection is not an always-on bonus.</text>
  <text x="70" y="625" fill="#a2bbad" font-family="sans-serif" font-size="20">Original reference diagram / official Wiki data / not a gameplay test</text>
</svg>
