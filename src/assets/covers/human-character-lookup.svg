<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101b2a"/><g font-family="Segoe UI, Arial, sans-serif"><text x="52" y="64" fill="#89d9ca" font-size="22" letter-spacing="2">ANIIMO / HUMAN CHARACTERS</text><text x="52" y="144" fill="#ffffff" font-size="48" font-weight="700">From a name to a quest objective</text><rect x="52" y="215" width="352" height="247" rx="18" fill="#20384a"/><text x="72" y="270" fill="#89d9ca" font-size="23">01 / NAME</text><text x="72" y="336" fill="#ffffff" font-size="29" font-weight="700">Dora / Dr. Lewis</text><text x="72" y="394" fill="#dde7f4" font-size="22">Check the cited context</text><rect x="424" y="215" width="352" height="247" rx="18" fill="#20384a"/><text x="444" y="270" fill="#89d9ca" font-size="23">02 / QUEST</text><text x="444" y="336" fill="#ffffff" font-size="29" font-weight="700">Match the title</text><text x="444" y="394" fill="#dde7f4" font-size="22">Read your current log</text><rect x="796" y="215" width="352" height="247" rx="18" fill="#20384a"/><text x="816" y="270" fill="#89d9ca" font-size="23">03 / OBJECTIVE</text><text x="816" y="336" fill="#ffffff" font-size="29" font-weight="700">Find the next step</text><text x="816" y="394" fill="#dde7f4" font-size="22">Dialogue, travel or claim</text><path d="M52 543H1148" stroke="#405871"/><text x="52" y="596" fill="#b9c8d9" font-size="20">ORIGINAL LOOKUP DIAGRAM / SOURCES REVIEWED 2026-11-12</text></g></svg>
